name: Retag corrected v0.5.6 once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retag-v0.5.6.yml"

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrected source
        uses: actions/checkout@v4

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/retag-v0.5.6.yml
          git commit -m "Remove one-time retag workflow"
          git push origin HEAD:main

      - name: Recreate corrected release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          corrected_sha="$(git rev-parse HEAD)"
          gh release delete v0.5.6 \
            --repo "${{ github.repository }}" --cleanup-tag --yes
          git tag v0.5.6 "$corrected_sha"
          git push origin refs/tags/v0.5.6
          gh release create v0.5.6 \
            --repo "${{ github.repository }}" \
            --target "$corrected_sha" \
            --title "TeddyCloud Runtime v0.5.6" \
            --notes "Bereinigte Veröffentlichung der TeddyCloud-Runtime-Integration für Home Assistant."
