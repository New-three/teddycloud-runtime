name: Remove superseded v0.5.6 once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-v0.5.6.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-v0.5.6.yml
          git commit -m "Remove one-time cleanup workflow"
          git push origin HEAD:main

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release delete v0.5.6
          --repo "${{ github.repository }}"
          --cleanup-tag
          --yes
